# Runs the published image on a host. Start it through sops so the token only
# ever exists in the process environment:
#
#   sops exec-env secrets/prod.enc.yaml 'docker compose -f deployments/docker-compose.yaml up -d'
#
# The image lives in a private Amazon ECR repository, so first name the
# registry and log in to it with AWS credentials that may pull from
# `cnayp-discord-bot` (the login lasts 12 hours). ECR_REGISTRY is not a secret,
# and sops exec-env passes it through to compose:
#
#   export ECR_REGISTRY=<account>.dkr.ecr.us-east-1.amazonaws.com
#   aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
#
# The personal-infra host does not use this file: it runs `:latest` from its
# own compose project, pulled by personal-infra-deploy@cnayp_discord_bot.
services:
  bot:
    image: ${ECR_REGISTRY:?set to <account>.dkr.ecr.us-east-1.amazonaws.com}/cnayp-discord-bot:edge
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set via sops exec-env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
